name: Release

# Crie uma tag de versão (ex.: git tag v0.3.0 && git push origin v0.3.0)
# e esta automação compila o app e publica os instaladores na página de Releases.
on:
  push:
    tags: ["v*"]
  # Mudou o app de desktop? Compila (sem publicar) para conferir que o instalador continua saindo.
  pull_request:
    paths: ["desktop/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar (${{ matrix.nome }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nome: Windows, alvo: --win }
          - { os: ubuntu-latest, nome: Linux, alvo: --linux }
          - { os: macos-latest, nome: macOS, alvo: --mac }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm atual (traz um node-gyp que reconhece o Visual Studio mais novo do Windows)
        run: npm i -g npm@latest
      - name: Servidor
        working-directory: server
        run: |
          npm ci
          npm run build
      - name: App de desktop
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder ${{ matrix.alvo }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # sem certificado de assinatura (ainda)
      - name: Conferir se o servidor liga dentro do app compilado
        if: runner.os != 'macOS'
        shell: bash
        working-directory: desktop/release
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            ./*.AppImage --appimage-extract > /dev/null
            EXE=squashfs-root/ktn-office; RES=squashfs-root/resources
          else
            EXE="win-unpacked/KTN Office.exe"; RES=win-unpacked/resources
          fi
          export ELECTRON_RUN_AS_NODE=1 KTN_PORT=7790 KTN_DADOS="$RUNNER_TEMP/dados" KTN_CLIS_CUSTOM="$RUNNER_TEMP/c.json"
          "$EXE" "$RES/app/server/dist/index.js" > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7790/status > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:7790/status && curl -fs http://127.0.0.1:7790/ -o pagina.html && grep -q "KTN Office" pagina.html && echo " ✔ servidor e interface OK" || { cat servidor.log; exit 1; }
          rm -f pagina.html servidor.log
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.nome }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.dmg
          if-no-files-found: error

  publicar:
    name: Publicar na página de Releases
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Somas de verificação (SHA-256)
        run: cd arquivos && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: arquivos/*
          generate_release_notes: true
          body: |
            ## Baixar
            - **Windows:** `KTN-Office-Setup-*.exe` (instalador) ou `KTN-Office-Portatil-*.exe` (sem instalar)
            - **Linux:** `*.AppImage`
            - **macOS:** `*.dmg`

            O instalador ainda não é assinado digitalmente: no Windows pode aparecer "O Windows protegeu o computador"
            → **Mais informações → Executar assim mesmo**. Confira o arquivo com o `SHA256SUMS.txt` se quiser.
            Este binário foi compilado automaticamente pelo GitHub Actions a partir do código desta versão (veja a aba Actions).
